name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and export static site
        run: npm run build

      - name: Add CNAME file
        run: echo "www.vxsoftwaresolutions.com" > ./out/CNAME

      - name: Create proper robots.txt
        run: |
          cat > ./out/robots.txt << 'EOF'
          User-agent: *
          Allow: /
          Disallow: /admin/
          Disallow: /api/
          Disallow: /_next/

          Host: https://www.vxsoftwaresolutions.com

          Sitemap: https://www.vxsoftwaresolutions.com/sitemap.xml
          Sitemap: https://www.vxsoftwaresolutions.com/sitemap-0.xml
          EOF

      - name: Remove unnecessary .txt files
        run: find ./out -name "*.txt" ! -name "robots.txt" -type f -delete

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
